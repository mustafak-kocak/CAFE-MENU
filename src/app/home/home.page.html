<div class="page-layout">
  
  <aside class="custom-sidebar">
    <div class="sidebar-header">
      <div class="avatar-container">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Yönetici Fotoğrafı">
      </div>
      <h2>HOŞ GELDİNİZ</h2>
      <p>Yönetici Paneli</p>
    </div>

    <div class="menu-section">
      <h3 class="menu-title">MENÜ</h3>
      <ion-list lines="none" class="sidebar-list">
        <ion-item routerLink="/home" routerDirection="root" class="menu-item active-menu">
          <ion-icon slot="start" name="grid-outline"></ion-icon>
          <ion-label>Ürünler</ion-label>
        </ion-item>
        
        <ion-item (click)="openCart()" class="menu-item" style="cursor: pointer;">
          <ion-icon slot="start" name="cart-outline"></ion-icon>
          <ion-label>Sepetim</ion-label>
        </ion-item>
      </ion-list>
    </div>

    <div class="sidebar-footer">
      <h1>MusCOFFEE</h1>
      <p>v1.0.0</p>
    </div>
  </aside>

  <main class="main-content">
    
    <div class="main-header">
      <h1 class="header-title">MusCOFFEE Menu</h1>
      <button class="btn-add-product" (click)="addNewItem()">
        <ion-icon name="add-outline"></ion-icon>
        Yeni Ürün
      </button>
    </div>

    <div class="content-scrollable">
      <div id="loadingText" *ngIf="!menuItems || menuItems.length === 0" class="ion-text-center ion-padding">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Ürünler Yükleniyor...</p>
      </div>

      <ion-grid class="ion-no-padding" *ngIf="menuItems && menuItems.length > 0">
        <ion-row class="ion-padding">
          <ion-col size="12" size-sm="6" size-md="4" size-lg="3" *ngFor="let item of menuItems">
            <div class="menu-item-container">
              <ion-card class="menu-card">
                
                <div class="image-wrapper" (click)="openMenuItem(item)">
                  <img 
                    [src]="item.image ? item.image : 'https://www.rapidseal.net/Admin/Sayfalar/bloglar/yeni-urunler-web-sitemize-eklendi.png'" 
                    (error)="handleImageError($event)"
                    class="item-img"
                    [alt]="item.name" />
                </div>

                <div class="card-info" (click)="openMenuItem(item)">
                  <h3 class="item-name">{{ item.name }}</h3>
                  <p class="item-price">{{ item.price }} TL</p>
                </div>

                <div class="card-actions">
                  <button class="btn-cart-add" (click)="addToCart(item)">
                    <ion-icon name="cart-outline"></ion-icon>
                    EKLE
                  </button>

                  <button class="btn-cart-del" (click)="deleteProduct(item.id)">
                    <ion-icon name="trash-outline"></ion-icon>
                  </button>
                </div>

              </ion-card>
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>

    <div class="floating-cart-btn" (click)="openCart()">
      <ion-icon name="cart"></ion-icon>
      <span class="cart-badge" *ngIf="cartItems?.length">{{ cartItems.length }}</span>
    </div>

  </main>

  <ion-modal [isOpen]="isAddModalOpen" (didDismiss)="closeAddModal()" class="add-product-modal">
    <ng-template>
      <div class="modal-inner-container">
        <div class="modal-header-custom">
          <h2>Yeni Ürün Ekle</h2>
          <button (click)="closeAddModal()" class="btn-close-modal">
            <ion-icon name="close-outline"></ion-icon>
          </button>
        </div>

        <div class="modal-body-custom">
          <div class="form-group">
            <label>Ürün Adı</label>
            <input type="text" [(ngModel)]="newProduct.name" placeholder="Örn: Espresso" class="custom-input" />
          </div>

          <div class="form-group">
            <label>Fiyat (TL)</label>
            <input type="number" [(ngModel)]="newProduct.price" placeholder="Örn: 45" class="custom-input" />
          </div>

          <div class="form-group">
            <label>Görsel URL</label>
            <input type="text" [(ngModel)]="newProduct.image" placeholder="https://..." class="custom-input" />
          </div>

          <button (click)="saveNewProduct()" class="btn-save-modal">
            Kaydet ve Ekle
          </button>
        </div>
      </div>
    </ng-template>
  </ion-modal>

</div>
